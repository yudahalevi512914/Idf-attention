<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח מפקד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffefa;--ink:#16263a;--mut:#6f7b88;--ok:#1e8a5a;--okbg:#e3f4ea;--bad:#d9541e;--badbg:#fdeadf;--sun:#f5b82e;--sunbg:#fff3d1;--line:#e8dfcc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a28;--card:#172538;--ink:#f3efe4;--mut:#9aa8b8;--ok:#4cd694;--okbg:#14382b;--bad:#ff8a52;--badbg:#3a2418;--sunbg:#3a3114;--line:#27384e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;padding:18px 14px 96px;display:flex;justify-content:center}
main{width:100%;max-width:520px}
h1{font-size:28px;font-weight:800;margin:4px 0}h1 span{color:var(--ok)}
h2{margin:6px 0 12px}h3{margin:0 0 8px;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#st{color:var(--mut);font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0}
textarea{min-height:70px;resize:vertical}
label{font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--ok);color:#fff;font-size:16px}
button.sec{background:transparent;color:var(--ink);border:2px solid var(--line);padding:7px 11px;font-size:14px}
button.x{background:transparent;color:var(--bad);padding:4px 8px;font-size:15px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.n{flex:0}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border:0}.item .t{flex:1}
.item small,.mut{color:var(--mut)}
.done .t{text-decoration:line-through;opacity:.5}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);margin-inline-end:4px}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.sun{background:var(--sunbg)}
.sol{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}
.sol:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button b{font-size:21px;font-weight:400}nav button.on{color:var(--ok)}
.chk{width:24px;height:24px;flex:0 0 24px;margin-top:2px;accent-color:var(--ok)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
.empty{color:var(--mut);padding:8px 0}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;text-align:center;padding:12px 6px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:30px;color:var(--ink);line-height:1.1}.stat.bad b{color:var(--bad)}.stat.sun{background:var(--sunbg)}
.lnks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
a.lnk{display:inline-block;text-decoration:none;font-weight:600;border:2px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:12px;font-size:14px;background:var(--card)}
.pill.wait{background:#dbeafe;color:#1d4ed8}@media(prefers-color-scheme:dark){.pill.wait{background:#1e3a5f;color:#93c5fd}}
.tm{display:inline-block;min-width:52px;font-weight:800;color:var(--ok)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.chead h3{margin:0}
.item.tap .t{cursor:pointer}
.task{border-inline-start:6px solid var(--line);padding-inline-start:8px;position:relative;background:var(--card)}
.task.p0{border-color:var(--bad)}.task.p1{border-color:var(--sun)}
.drag{touch-action:none;cursor:grab;font-size:22px;color:var(--mut);padding:0 4px;user-select:none;-webkit-user-select:none}
.task.dragging{opacity:.85;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:5;background:var(--card);border-radius:12px}
.task.ins{box-shadow:0 -4px 0 var(--ok)}.task.insend{box-shadow:0 4px 0 var(--ok)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));max-height:90vh;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pbtn.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.hint{font-size:12px;color:var(--mut)}
</style>
</head>
<body><main><div class="top"><h1>לוח <span>מפקד</span></h1><span id="st"></span></div><div id="app"></div></main>
<nav id="nav"></nav><div id="sheet"></div><div id="toast"></div>
<script>
const ROSTER=["נבו היימן","יואב תומר","ג׳ק בן חורין","גלעד ניאזוב","ניב ג׳רבי","ארז נבון","יהודה הלוי","איתי זיו","יהלי בנישו","עידן גבאי","מיכאל מנור","תומר אמתי","דניאל ריינס","לירוי חולודנקו","עמית דרוקר","ינון רותם פלד","רואי חזן","יותם רוטשילד","אור בהט","ארבל יצחקי","גור סלע","יהונתן הררי","עומר רז","מתן ענבי","ליאור סלבין","רואי טרייבנד","אילאי גירסטין"];
const TYPES=["בקשה","בקשת יציאה","פנייה","טענה","רפואי","הערה"], LST=["חדש","ממתין לתשובה מרמ״מ","נסגר"], OST=["חדשה","הועברה למטה","בוצעה"];
let S, pin="", tab="today", sel=null, editSquad=false, timer, SH=null;
const PRI=["🔴 דחוף","🟡 רגיל","⚪ נמוך"];
const $=id=>document.getElementById(id), app=$("app");
const nl=s=>esc(s).replace(/\n/g,"<br>");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jerusalem"});
const daysTo=d=>Math.round((new Date(d+"T12:00:00")-new Date(todayStr()+"T12:00:00"))/864e5);
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
const when=d=>{const n=daysTo(d);return n<0?`<span class="pill bad">באיחור ${-n} י׳</span>`:n===0?`<span class="pill bad">היום</span>`:n===1?`<span class="pill sun">מחר</span>`:`<span class="pill">${fmt(d)}</span>`};
const sd=n=>S.soldiers[n]||(S.soldiers[n]={notes:"",med:{status:"",expires:"",next:""},log:[]});
const toast=m=>{$("toast").textContent=m;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1800)};
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast("הועתק ✓"),()=>toast("ההעתקה נכשלה"));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

const api=async data=>{
  const r=await fetch(data===undefined?`/api/manager?pin=${encodeURIComponent(pin)}`:"/api/manager",data===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin,data})});
  if(r.status===401) throw new Error("401"); if(!r.ok) throw new Error("server"); return r.json();
};
const save=()=>{ $("st").textContent="שומר…"; clearTimeout(timer); timer=setTimeout(async()=>{ try{await api(S);$("st").textContent="נשמר ✓"}catch(e){$("st").textContent="⚠️ לא נשמר"} },500); };
const go=()=>{save();render()};

async function boot(){
  pin=lsGet("mpin")||"";
  for(;;){
    if(!pin){ pin=prompt("קוד כניסה:")||""; if(!pin){ app.innerHTML='<div class="card">נדרש קוד. רענן את הדף.</div>'; return; } }
    try{ const r=await api(); S=Object.assign({squad:[],soldiers:{},orders:[],tasks:[]},r.data||{}); S.tasks.forEach(t=>{ if(t.pri===undefined) t.pri=t.hot?0:1; }); S.schedule=S.schedule||{}; Object.values(S.soldiers).forEach(s=>s.log.forEach(l=>{ if(l.st==="הועלה") l.st="ממתין לתשובה מרמ״מ"; })); lsSet("mpin",pin); break; }
    catch(e){ if(e.message==="401"){ pin=""; lsSet("mpin",null); continue; } app.innerHTML='<div class="card">שגיאת שרת. נסה לרענן.</div>'; return; }
  }
  render();
  pullInbox().then(n=>{ if(n){ toast(`${n} פניות חדשות מהחיילים`); render(); } else pub(); });
  setInterval(async()=>{ if(document.hidden||tab!=="today"||SH) return; const n=await pullInbox(); if(n){ toast(`${n} פניות חדשות מהחיילים`); render(); } },60000);
}

function render(){
  $("nav").innerHTML=[["today","🎛️","בקרה"],["sol","👥","חיילים"],["ord","📢","הוראות"],["task","✅","משימות"],["sum","📊","סיכומים"]].map(([k,i,l])=>`<button data-a="tab" data-k="${k}" class="${tab===k?"on":""}"><b>${i}</b>${l}</button>`).join("");
  if(!S.squad.length||editSquad) return app.innerHTML=squadPicker();
  app.innerHTML=tab==="today"?today():tab==="sol"?(sel?soldier(sel):soldiers()):tab==="ord"?orders():tab==="sum"?summaries():tab==="sched"?schedule():tasks();
}
const stCls=s=>s==="חדש"||s==="חדשה"?"sun":s==="ממתין לתשובה מרמ״מ"?"wait":["נסגר","בוצעה","הועברה למטה"].includes(s)?"ok":"";
function renderSheet(){
  const box=$("sheet");
  if(!SH){ box.innerHTML=""; return; }
  let b="";
  const chips=l=>`<div class="chips">${l.map(s=>`<button class="sec" data-a="chip" data-v="${s}">${s}</button>`).join("")}</div>`;
  if(SH.kind==="newlog"){
    b=`<h3>פנייה חדשה</h3><select id="e_n">${S.squad.map(n=>`<option ${n===SH.n?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <select id="e_type">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
    <textarea id="e_text" placeholder="מה הפנייה / הבקשה"></textarea>
    <label>סטטוס</label><input id="e_st" value="חדש">${chips(LST)}
    <div class="row" style="margin-top:8px"><button data-a="shsave">שמור</button></div>`;
  } else if(SH.kind==="task"){
    const t=S.tasks.find(x=>x.id===SH.id);
    b=`<h3>עריכת משימה</h3><textarea id="e_text">${esc(t.text)}</textarea>
    <label>תאריך יעד</label><input id="e_due" type="date" value="${esc(t.due||"")}">
    <label>🔔 תזכורת בטלפון (תאריך ושעה)</label><input id="e_rem" type="datetime-local" value="${esc(t.rem||"")}">
    <label>עדיפות</label><div class="row">${PRI.map((p,i)=>`<button class="sec pbtn ${t.pri===i?"on":""}" data-a="setpri" data-i="${i}">${p}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button data-a="shsave">שמור</button><button class="sec" data-a="toics">📲 הוסף לטלפון</button></div>
    <div class="row" style="margin-top:8px"><button class="sec" data-a="totop">⬆ לראש הרשימה</button><button class="sec" style="color:var(--bad)" data-a="shdel">מחק</button></div>`;
  } else if(SH.kind==="order"){
    const o=S.orders.find(x=>x.id===SH.id);
    b=`<h3>עריכת הוראה</h3><textarea id="e_text">${esc(o.text)}</textarea>
    <div class="row"><div><label>ממי</label><input id="e_from" value="${esc(o.from||"")}"></div><div><label>עד מתי</label><input id="e_due" type="date" value="${esc(o.due||"")}"></div></div>
    <label>סטטוס (אפשר לכתוב כל דבר)</label><input id="e_st" value="${esc(o.st)}">${chips(OST)}
    <div class="row" style="margin-top:8px"><button data-a="shsave">שמור</button><button class="sec" style="color:var(--bad)" data-a="shdel">מחק</button></div>`;
  } else {
    const l=sd(SH.n).log.find(x=>x.id===SH.id);
    b=`<h3>${esc(SH.n)} · עריכת רישום</h3><select id="e_type">${TYPES.map(t=>`<option ${t===l.type?"selected":""}>${t}</option>`).join("")}</select>
    <textarea id="e_text">${esc(l.text)}</textarea>
    <label>סטטוס (אפשר לכתוב כל דבר)</label><input id="e_st" value="${esc(l.st)}">${chips(LST)}
    <div class="row" style="margin-top:8px"><button data-a="shsave">שמור</button><button class="sec" data-a="shcopy">העתק</button><button class="sec" style="color:var(--bad)" data-a="shdel">מחק</button></div>`;
  }
  box.innerHTML=`<div class="sheetbg" data-a="shclose"><div class="sheet" data-stop="1">${b}<button class="sec" data-a="shclose" style="width:100%;margin-top:10px">סגור</button></div></div>`;
}
const openSheet=s=>{SH=s;renderSheet()};
const closeSheet=()=>{SH=null;renderSheet()};
function squadPicker(){
  return `<div class="card"><h2>מי הכיתה שלך?</h2><p class="mut">סמן את החיילים שבאחריותך.</p>${ROSTER.map(n=>`<label class="item" style="font-size:17px;color:var(--ink)"><input class="chk" type="checkbox" data-sq="${esc(n)}" ${S.squad.includes(n)?"checked":""}><span class="t">${esc(n)}</span></label>`).join("")}<button data-a="sqsave" style="width:100%;margin-top:10px">שמור</button></div>`;
}
function openLog(){ const o=[]; S.squad.forEach(n=>sd(n).log.forEach(l=>{ if(isOpen(l.st)) o.push({n,...l}); })); return o.sort((a,b)=>(a.st==="חדש"?0:1)-(b.st==="חדש"?0:1)||a.t-b.t); }
function today(){
  const t=todayStr(), ol=openLog(), nNew=ol.filter(l=>l.st==="חדש").length;
  const urgent=S.tasks.filter(x=>!x.done&&(x.pri===0||(x.due&&daysTo(x.due)<=0)));
  const od=S.orders.filter(x=>x.st!=="בוצעה"&&x.due&&daysTo(x.due)<=2);
  const med=[]; S.squad.forEach(n=>{const m=sd(n).med; if(m.expires&&daysTo(m.expires)<=7) med.push([n,"תוקף רפואי",m.expires,m.status]); if(m.next&&daysTo(m.next)>=0&&daysTo(m.next)<=3) med.push([n,"תור/מעקב",m.next,""]);});
  const sch=(S.schedule[t]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t));
  const row=(txt,d)=>`<div class="item"><div class="t">${txt}</div>${d?when(d):""}</div>`;
  return `<h2>לוח בקרה</h2>
  <div class="stats"><div class="stat bad"><b>${ol.length}</b>פניות פתוחות</div><div class="stat sun"><b>${nNew}</b>חדשות</div><div class="stat"><b>${urgent.length}</b>משימות דחופות</div></div>
  <div class="lnks"><a class="lnk" href="/#admin" target="_blank">📋 מעקב נוכחות</a><button class="sec" data-a="schedview">📅 לו״ז</button><button class="sec" data-a="cpsol">🔗 קישור לחיילים</button><button class="sec" data-a="refresh">🔄 רענן</button></div>
  <div class="card"><div class="chead"><h3>📨 פניות ובקשות פתוחות</h3><button class="sec" data-a="newlog">➕ פנייה חדשה</button></div>
    ${ol.length?ol.map(l=>`<div class="item tap" data-a="editlog" data-n="${esc(l.n)}" data-id="${l.id}"><div class="t"><b>${esc(l.n)}</b> <span class="pill">${esc(l.type)}</span><span class="pill ${stCls(l.st)}">${esc(l.st)}</span>${l.src==="soldier"?'<span class="pill">מהחייל</span>':""}<br><small>${fmt(dayOfMs(l.t))}</small> ${nl(l.text)}</div></div>`).join(""):'<div class="empty">אין פניות פתוחות 🎉</div>'}
    ${ol.length?'<button class="sec" data-a="cpopen" style="margin-top:8px">העתק רשימה לשליחה לרמ״מ</button>':""}</div>
  <div class="card"><h3>🔥 משימות דחופות</h3>${urgent.length?urgent.map(x=>`<div class="item"><input class="chk" type="checkbox" data-a="tdone" data-id="${x.id}"><div class="t" data-a="edittask" data-id="${x.id}" style="cursor:pointer">${x.pri===0?"🔴 ":""}${esc(x.text)}</div>${x.due?when(x.due):""}</div>`).join(""):'<div class="empty">אין משימות דחופות</div>'}</div>
  <div class="card"><div class="chead"><h3>📅 הלו״ז להיום</h3><button class="sec" data-a="schedview">עריכה</button></div>${sch.length?sch.map(s=>`<div class="item"><div class="t"><span class="tm">${esc(s.t)}</span>${esc(s.x)}</div></div>`).join(""):'<div class="empty">לא הוזן לו״ז להיום. החיילים רואים אותו בדף שלהם.</div>'}</div>
  ${med.length?`<div class="card"><h3>🩺 רפואי ותורים קרובים</h3>${med.map(([n,k,d,s])=>row(`<b>${esc(n)}</b> · ${k}${s?`<br><small>${esc(s)}</small>`:""}`,d)).join("")}</div>`:""}
  ${od.length?`<div class="card"><h3>📢 הוראות שמתקרבות</h3>${od.map(x=>row(esc(x.text),x.due)).join("")}</div>`:""}
  <button data-a="cprem" class="sec" style="width:100%">📲 הכן תזכורות לטלפון</button>`;
}
// ---------- schedule editor ----------
let SD=null;
function schedule(){
  const d=SD||todayStr(), L=(S.schedule[d]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t));
  return `<button class="sec" data-a="back2">→ חזרה ללוח הבקרה</button><h2 style="margin-top:10px">לו״ז</h2>
  <div class="card"><div class="row"><button class="sec n" data-a="sdnext">›</button><input type="date" data-sd="1" value="${d}"><button class="sec n" data-a="sdprev">‹</button></div>
    <button class="sec" data-a="sdcopy" style="width:100%;margin-top:8px">העתק מהיום הקודם</button></div>
  <div class="card"><h3>הוספת פריט</h3><div class="row"><input id="s_x" placeholder="מה קורה"><input id="s_t" type="time" style="flex:0 0 120px"></div><button data-a="sadd" style="width:100%;margin-top:6px">הוסף</button></div>
  <div class="card"><span class="hint">לחץ על פריט כדי לערוך את הטקסט. החיילים רואים את הלו״ז בדף שלהם.</span>${L.length?L.map(s=>`<div class="item"><div class="t" data-a="sedit" data-id="${s.id}" style="cursor:pointer"><span class="tm">${esc(s.t)}</span>${esc(s.x)}</div><button class="x" data-a="sdel" data-id="${s.id}">✕</button></div>`).join(""):'<div class="empty">אין פריטים ליום הזה</div>'}</div>`;
}

function soldiers(){
  return `<div class="row" style="margin-bottom:8px"><h2 style="flex:1;margin:0">הכיתה שלי</h2><button class="sec n" data-a="editsq">ערוך הרכב</button></div><div class="card">`+S.squad.map(n=>{
    const s=sd(n), open=s.log.filter(l=>l.st==="חדש").length, m=s.med, w=m.expires&&daysTo(m.expires)<=7;
    return `<div class="sol" data-a="open" data-n="${esc(n)}"><span>${esc(n)}</span><span>${w?'<span class="pill bad">רפואי</span>':""}${open?`<span class="pill sun">${open} פתוחות</span>`:""}‹</span></div>`;
  }).join("")+`</div>`;
}
function soldier(n){
  const s=sd(n), m=s.med;

const pass=(open,s)=>s==="all"||(s==="open"?open:!open);
function buildSummary(){
  const today=new Date().toLocaleDateString("he-IL",{day:"numeric",month:"numeric",year:"numeric",timeZone:"Asia/Jerusalem"});
  const tables=[], prev=[]; let title;
  if(SUM.src==="log"){
    title=SUM.type?`סיכום ${SUM.type}`:"סיכום פניות ובקשות";
    const rows=[];
    S.squad.filter(n=>!SUM.soldier||n===SUM.soldier).forEach(n=>sd(n).log.forEach(l=>{
      if((!SUM.type||l.type===SUM.type)&&pass(isOpen(l.st),SUM.status)) rows.push({n,l});
    }));
    rows.sort((a,b)=>a.n.localeCompare(b.n,"he")||a.l.t-b.l.t);
    tables.push({heading:SUM.type||"פניות ובקשות",cols:[{h:"חייל",w:2.2},{h:"סוג",w:1.8},{h:"תאריך",w:1.3},{h:"סטטוס",w:1.8},{h:"פירוט",w:6}],
      rows:rows.map(({n,l})=>[n,l.type,fmt(dayOfMs(l.t)),l.st,String(l.text).replace(/\s*\n\s*/g," | ")])});
    rows.forEach(({n,l})=>prev.push(`<b>${esc(n)}</b> · ${esc(l.type)} · <span class="pill ${stCls(l.st)}">${esc(l.st)}</span><br><small>${fmt(dayOfMs(l.t))}</small> ${nl(l.text)}`));
    if(SUM.type==="רפואי"){
      const med=S.squad.filter(n=>(!SUM.soldier||n===SUM.soldier)&&(sd(n).med.status||sd(n).med.expires||sd(n).med.next));
      tables.push({heading:"סטטוס רפואי כללי",cols:[{h:"חייל",w:2.2},{h:"סטטוס",w:5},{h:"תוקף עד",w:2},{h:"תור/מעקב הבא",w:2}],
        rows:med.map(n=>{const m=sd(n).med;return [n,m.status||"",fmtY(m.expires),fmtY(m.next)]})});
      med.forEach(n=>{const m=sd(n).med; prev.push(`<b>${esc(n)}</b> · סטטוס כללי<br>${esc(m.status||"")}${m.expires?` · תוקף ${fmtY(m.expires)}`:""}${m.next?` · תור ${fmtY(m.next)}`:""}`)});
    }
  } else if(SUM.src==="ord"){
    title="סיכום הוראות";
    const L=S.orders.filter(o=>pass(isOpen(o.st),SUM.status));
    tables.push({heading:"הוראות וציפיות",cols:[{h:"הוראה",w:6},{h:"ממי",w:2},{h:"עד מתי",w:2},{h:"סטטוס",w:2.2}],rows:L.map(o=>[o.text,o.from||"",fmtY(o.due),o.st])});
    L.forEach(o=>prev.push(`${esc(o.text)}<br><small>${o.from?esc(o.from)+" · ":""}${o.due?fmtY(o.due)+" · ":""}${esc(o.st)}</small>`));
  } else {
    title="סיכום משימות";
    const L=S.tasks.filter(t=>pass(!t.done,SUM.status));
    tables.push({heading:"משימות",cols:[{h:"משימה",w:6},{h:"עדיפות",w:1.5},{h:"יעד",w:2},{h:"תזכורת",w:2.6}],
      rows:L.map(t=>[t.text,PRI_PLAIN[t.pri]||"",fmtY(t.due),t.rem?`${fmtY(t.rem.slice(0,10))} ${t.rem.slice(11)}`:""])});
    L.forEach(t=>prev.push(`${t.pri===0?"🔴 ":""}${esc(t.text)}<br><small>${t.due?fmtY(t.due):"ללא תאריך"}${t.done?" · הושלמה":""}</small>`));
  }
  const count=tables[0].rows.length;
  const sub=`נוצר ב-${today} · ${count} פריטים · ${STL[SUM.status]}${SUM.soldier?` · ${SUM.soldier}`:""}`;
  return {doc:{title,sub,tables},prev,count,sub,title};
}

const shiftDay=(d,n)=>new Date(new Date(d+"T12:00:00").getTime()+n*864e5).toLocaleDateString("en-CA");

  await fetch("/api/manager",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin,action:"publish",squad:S.squad,schedule:keep})});
}catch(e){} },1200); }
const normN=n=>String(n).replace(/[׳’`]/g,"'").replace(/\s+/g," ").trim();
async function pullInbox(){
  try{
    const r=await fetch(`/api/manager?pin=${encodeURIComponent(pin)}&inbox=1`); if(!r.ok) return 0;
    const {items}=await r.json(); if(!items||!items.length) return 0; let added=0;
    items.forEach(it=>{
      let n=S.squad.find(s=>normN(s)===normN(it.name)); if(!n){ n=it.name; S.squad.push(n); }
      const s=sd(n); if(s.log.some(l=>l.sid===it.id)) return;
      let text=it.text; const type=it.kind==="exit"?"בקשת יציאה":it.kind==="general"?"פנייה":"רפואי"; if(it.appt) s.med.next=it.appt;
      if(it.kind==="medstatus"){ s.med.status=it.text; if(it.until) s.med.expires=it.until; text=`עדכון פטור/סטטוס רפואי: ${it.text}${it.until?" (בתוקף עד "+fmtY(it.until)+")":""}`; }
      s.log.push({id:uid(),sid:it.id,t:it.t,type,text,st:"חדש",src:"soldier"}); added++;
    });
    await api(S);   // save first, only then remove from the inbox
    await fetch("/api/manager",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin,action:"ack",ids:items.map(i=>i.id)})});
    if(added) pub();
    return added;
  }catch(e){ return 0; }
}

function shSave(){
  if(SH.kind==="newlog"){ const x=val("e_text").trim(); if(!x) return; sd(val("e_n")).log.push({id:uid(),t:Date.now(),type:val("e_type"),text:x,st:val("e_st").trim()||"חדש"}); return; }
  if(SH.kind==="task"){ const t=S.tasks.find(x=>x.id===SH.id); const rem=val("e_rem"); if(rem!==(t.rem||"")) t.remSent=false;
    Object.assign(t,{text:val("e_text").trim()||t.text,due:val("e_due"),rem,pri:SH.pri}); }
  else if(SH.kind==="order"){ const o=S.orders.find(x=>x.id===SH.id); Object.assign(o,{text:val("e_text").trim()||o.text,from:val("e_from").trim(),due:val("e_due"),st:val("e_st").trim()||o.st}); }
  else { const l=sd(SH.n).log.find(x=>x.id===SH.id); Object.assign(l,{type:val("e_type"),text:val("e_text").trim()||l.text,st:val("e_st").trim()||l.st}); }
}
// reorder: move task id to index among open tasks
function moveTask(id,idx){
  const act=S.tasks.filter(t=>!t.done), done=S.tasks.filter(t=>t.done), t=act.find(x=>x.id===id);
  const rest=act.filter(x=>x!==t); idx=Math.max(0,Math.min(rest.length,idx)); rest.splice(idx,0,t); S.tasks=[...rest,...done];
}

let drag=null;
document.addEventListener("pointerdown",e=>{
  const hd=e.target.closest("[data-drag]"); if(!hd) return;
  const row=hd.closest(".task"), list=$("tl"); if(!list||!list.contains(row)) return;
  e.preventDefault(); hd.setPointerCapture?.(e.pointerId);
  drag={row,y0:e.clientY,id:row.dataset.id,list,idx:null}; row.classList.add("dragging");
});
document.addEventListener("pointermove",e=>{
  if(!drag) return; e.preventDefault();
  drag.row.style.transform=`translateY(${e.clientY-drag.y0}px)`;
  const others=[...drag.list.querySelectorAll(".task")].filter(r=>r!==drag.row);
  others.forEach(r=>r.classList.remove("ins","insend"));
  let idx=0; others.forEach(r=>{const b=r.getBoundingClientRect(); if(e.clientY>b.top+b.height/2) idx++;});
  drag.idx=idx; if(others[idx]) others[idx].classList.add("ins"); else if(others.length) others[others.length-1].classList.add("insend");
},{passive:false});
const endDrag=e=>{
  if(!drag) return; const {id,idx}=drag; drag.row.style.transform=""; drag.row.classList.remove("dragging");
  document.querySelectorAll(".ins,.insend").forEach(r=>r.classList.remove("ins","insend")); drag=null;
  if(idx!==null) { moveTask(id,idx); go(); }
};
document.addEventListener("pointerup",endDrag); document.addEventListener("pointercancel",()=>{ if(drag){drag.row.style.transform="";drag.row.classList.remove("dragging");drag=null;} });
const onClick=e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  if(b.dataset.a==="shclose"&&e.target.closest("[data-stop]")&&!e.target.closest("button")) return; // tap inside sheet body
  A[b.dataset.a]?.(b.dataset);
};
app.addEventListener("click",onClick); $("sheet").addEventListener("click",onClick);
$("nav").addEventListener("click",e=>{const b=e.target.closest("[data-a]"); if(b) A[b.dataset.a](b.dataset)});
app.addEventListener("change",e=>{
  if(e.target.dataset.sd){ SD=e.target.value||null; render(); return; }
  const k=e.target.dataset.sum; if(k){ SUM[k]=e.target.value; if(k==="src"){SUM.type="";SUM.soldier="";} render(); return; }
  const f=e.target.dataset.f; if(!f) return; const s=sd(e.target.dataset.n);
  if(f==="notes") s.notes=e.target.value; else s.med[f]=e.target.value; save();
});
boot();
</script>
</body></html>
